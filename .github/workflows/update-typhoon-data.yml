name: Scheduled AI Typhoon Data Update

on:
  schedule:
    # 每 3 小時自動執行一次 (UTC 時間，對應台灣時間 02:00, 05:00, 08:00, 11:00, 14:00, 17:00, 20:00, 23:00)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: typhoon-data-update
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    outputs:
      data-ref: ${{ steps.commit.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Offline Regression Tests
        run: npm test

      - name: Fetch Official CWA/DGPA Data & Run Probability Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update_typhoon_data.mjs

      - name: Commit and Push Updated Forecast Data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-data.json
          if git diff --staged --quiet; then
            echo "No changes in typhoon-data.json"
          else
            git commit -m "chore(data): auto-update typhoon AI probability forecast"
            git push
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update-forecast
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update-forecast.outputs.data-ref }}
