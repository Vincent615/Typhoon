name: Scheduled Typhoon and News Update

on:
  schedule:
    # 每 3 小時自動執行一次 (UTC 時間，對應台灣時間 02:00, 05:00, 08:00, 11:00, 14:00, 17:00, 20:00, 23:00)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: typhoon-data-update
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    outputs:
      data-ref: ${{ steps.commit.outputs.ref }}
      forecast-result: ${{ steps.forecast.outcome }}
      news-result: ${{ steps.news.outcome }}
      monitoring-mode: ${{ steps.monitoring.outputs.mode }}
      data-changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Offline Regression Tests
        run: npm test

      - name: Fetch Official CWA/DGPA Data & Run Probability Engine
        id: forecast
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update_typhoon_data.mjs

      - name: Read Saved Monitoring Mode
        id: monitoring
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          const data = JSON.parse(await fs.readFile('data/typhoon-data.json', 'utf8'));
          const mode = data.monitoring?.mode ?? 'active';
          if (!['active', 'standby'].includes(mode)) throw new Error('Invalid saved monitoring mode');
          if (mode === 'standby' && (data.officialSync?.cwaStatus !== 'no_active' ||
              !Array.isArray(data.scenarios) || data.scenarios.length === 0 ||
              data.scenarios.some((scenario) => scenario.hasTyphoon !== false))) {
            throw new Error('Saved standby state is inconsistent with forecast data');
          }
          await fs.appendFile(process.env.GITHUB_OUTPUT, `mode=${mode}\n`);
          NODE

      - name: Fetch Recent Typhoon News
        id: news
        if: ${{ steps.monitoring.outputs.mode == 'active' }}
        continue-on-error: true
        run: npm run update-news

      - name: Commit and Push Updated Data
        id: commit
        env:
          MONITORING_MODE: ${{ steps.monitoring.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon-data.json
          if [ -f data/news.json ]; then
            git add data/news.json
          fi
          if git diff --staged --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$MONITORING_MODE" = "standby" ]; then
              last_commit=$(git log -1 --format=%ct)
              current_time=$(date +%s)
              if (( current_time - last_commit >= 28 * 24 * 60 * 60 )); then
                git commit --allow-empty -m "chore: keep scheduled typhoon discovery active"
                git push
              fi
            fi
          else
            git commit -m "chore(data): update typhoon forecast and news"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update-forecast
    if: ${{ needs.update-forecast.outputs.data-changed == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update-forecast.outputs.data-ref }}

  check-source-results:
    needs: [update-forecast, deploy]
    if: ${{ always() && needs.update-forecast.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report update and deployment results
        env:
          FORECAST_RESULT: ${{ needs.update-forecast.outputs.forecast-result }}
          NEWS_RESULT: ${{ needs.update-forecast.outputs.news-result }}
          MONITORING_MODE: ${{ needs.update-forecast.outputs.monitoring-mode }}
          DATA_CHANGED: ${{ needs.update-forecast.outputs.data-changed }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$FORECAST_RESULT" != "success" ]; then
            echo "::error::Forecast update failed; the previous forecast was retained (mode=$MONITORING_MODE, news=$NEWS_RESULT)."
            exit 1
          fi
          if { [ "$MONITORING_MODE" = "active" ] && [ "$NEWS_RESULT" = "success" ]; } ||
             { [ "$MONITORING_MODE" = "standby" ] && [ "$NEWS_RESULT" = "skipped" ]; }; then
            :
          else
            echo "::error::Unexpected news result for monitoring mode (mode=$MONITORING_MODE, news=$NEWS_RESULT)."
            exit 1
          fi
          if { [ "$DATA_CHANGED" = "true" ] && [ "$DEPLOY_RESULT" = "success" ]; } ||
             { [ "$DATA_CHANGED" = "false" ] && [ "$DEPLOY_RESULT" = "skipped" ]; }; then
            :
          else
            echo "::error::Deployment did not match the data change result (changed=$DATA_CHANGED, deployment=$DEPLOY_RESULT)."
            exit 1
          fi
          echo "Update cycle completed (mode=$MONITORING_MODE, changed=$DATA_CHANGED, news=$NEWS_RESULT, deployment=$DEPLOY_RESULT)."
