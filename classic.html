<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣颱風假機率觀測平台</title>
  <meta name="description" content="台灣 22 縣市颱風假機率與颱風動態，資料來自中央氣象署，每 3 小時自動更新。" />
  <meta name="theme-color" content="#F2EFEA" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%238A5250'/%3E%3Cpath d='M16 4a12 12 0 0 1 12 12M16 28A12 12 0 0 1 4 16' stroke='%238A5250' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/news.css" />
</head>
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand">
        <h1>台灣颱風假機率觀測平台</h1>
        <label class="storm">
          <span class="live-dot" id="live-dot" hidden></span>
          <select id="scenario-select" aria-label="選擇颱風"></select>
        </label>
      </div>
      <div class="bar-right">
        <span class="updated" id="updated-at"></span>
        <a href="./" class="mode-link">極致全息版 →</a>
      </div>
    </header>

    <nav class="page-nav" aria-label="頁面導覽">
      <a href="#storm-map">颱風地圖</a>
      <a href="#county-weather">縣市風雨</a>
      <a href="#latest-news">最新消息</a>
    </nav>

    <main class="layout">
      <section class="card map-card" id="storm-map" aria-label="颱風地圖與預報時間軸">
        <div class="map-wrap">
          <canvas id="typhoon-canvas" aria-label="颱風動態與各縣市機率地圖"></canvas>





          <div class="legend" aria-hidden="true">
            <div class="legend-bar"></div>
            <div class="legend-scale">
              <span style="left:0">0</span>
              <span style="left:40%">40</span>
              <span style="left:65%">65</span>
              <span style="left:85%">85</span>
              <span style="left:100%">%</span>
            </div>
          </div>
        </div>

          <div class="stats" id="stats">
            <div class="stat"><span>中心氣壓</span><b id="s-pressure">—</b></div>
            <div class="stat"><span>最大風速</span><b id="s-wind">—</b></div>
            <div class="stat"><span>七級半徑</span><b id="s-radius">—</b></div>
            <div class="stat"><span>移動</span><b id="s-move">—</b></div>
          </div>

        <div class="map-controls">
          <label class="map-county-picker">
            <span class="sr-only">查看縣市</span>
            <select id="map-county-select" aria-label="選擇地圖縣市" disabled><option value="">載入縣市…</option></select>
          </label>
          <div class="tools" role="group" aria-label="圖層">
            <button type="button" class="tool on" aria-pressed="true" data-layer="cloud">雲系</button>
            <button type="button" class="tool on" aria-pressed="true" data-layer="wind">風場</button>
            <button type="button" class="tool on" aria-pressed="true" data-layer="radius">暴風圈</button>
          </div>
        </div>

        <div class="timeline">
          <button type="button" class="play" id="btn-play" aria-label="播放">
            <svg id="icon-play" viewBox="0 0 16 16" width="14" height="14"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg>
            <svg id="icon-pause" viewBox="0 0 16 16" width="14" height="14" hidden><rect x="3.5" y="2.8" width="3" height="10.4" rx="1" fill="currentColor"/><rect x="9.5" y="2.8" width="3" height="10.4" rx="1" fill="currentColor"/></svg>
            <span id="play-label">播放</span>
          </button>
          <div class="track">
            <input type="range" id="timeline-slider" min="0" max="1" step="0.001" value="0" aria-label="時間軸" />
            <div class="ticks" id="timeline-ticks" role="group" aria-label="選擇預報時次"></div>
          </div>
          <div class="readout">
            <span id="time-offset">—</span>
            <b id="time-display">—</b>
          </div>
        </div>
      </section>

      <aside class="side">
        <section class="card detail" id="county-weather" aria-label="縣市風雨估算">
          <div class="detail-head">
            <div>
              <span class="zone" id="d-zone">—</span>
              <h2 id="d-name">—</h2>
              <label class="county-picker">
                <span class="county-picker-label">查看縣市</span>
                <select id="county-select" aria-label="查看縣市" disabled><option value="">載入縣市…</option></select>
              </label>
              <div class="status"><i id="d-dot"></i><span id="d-status">—</span></div>
            </div>
            <div class="ring">
              <svg viewBox="0 0 88 88" width="88" height="88">
                <circle class="bg" cx="44" cy="44" r="38" />
                <circle class="fg" id="d-ring" cx="44" cy="44" r="38" />
              </svg>
              <div class="val"><span id="d-prob">—</span><small>%</small></div>
            </div>
          </div>

          <div class="meters">
            <div class="meter">
              <div class="meter-top"><span>風力</span><b id="m-wind">—</b></div>
              <div class="meter-bar"><i id="m-wind-bar"></i><em id="m-wind-mark"></em></div>
              <div class="meter-foot">標準：平均 7 級或陣風 10 級</div>
            </div>
            <div class="meter">
              <div class="meter-top"><span>24 小時雨量</span><b id="m-rain">—</b></div>
              <div class="meter-bar"><i id="m-rain-bar"></i><em id="m-rain-mark"></em></div>
              <div class="meter-foot" id="m-rain-foot">—</div>
            </div>
          </div>

          <p class="note" id="d-note" hidden></p>
        </section>

        <section class="card list-card">
          <div class="list-head">
            <div class="seg" id="region-tabs">
              <button type="button" class="on" data-region="ALL">全部</button>
              <button type="button" data-region="北部">北</button>
              <button type="button" data-region="中部">中</button>
              <button type="button" data-region="南部">南</button>
              <button type="button" data-region="東部">東</button>
              <button type="button" data-region="外島">離島</button>
            </div>
            <button type="button" class="sort" id="btn-sort">依機率</button>
          </div>
          <ol class="county-list" id="county-list"></ol>
        </section>

        <section class="card brief" id="brief" hidden>
          <h3>概況</h3>
          <p id="brief-text"></p>
          <button type="button" id="brief-toggle" aria-controls="brief-text" aria-expanded="false">展開</button>
        </section>
      </aside>
      <section class="news-section" id="latest-news" aria-labelledby="news-heading">
        <div class="news-head">
          <h2 id="news-heading">颱風最新消息</h2>
          <button class="news-button" type="button" data-news-refresh>重新載入</button>
        </div>
        <p class="news-description">近 7 天相關報導，每 3 小時整理。點選標題可開啟媒體原文。</p>
        <p class="news-status" data-news-status role="status">正在載入新聞…</p>
        <ul class="news-list" data-news-list></ul>
        <p class="news-empty" data-news-empty hidden>近 7 天暫無符合條件的颱風新聞，可前往下方媒體網站查看。</p>
        <button class="news-button" type="button" data-news-more aria-expanded="false" hidden>顯示更多消息</button>
        <div class="news-footer">
          <span>新聞來源</span>
          <a href="https://www.cna.com.tw/list/ahel.aspx" target="_blank" rel="noopener noreferrer">中央通訊社</a>
          <a href="https://news.pts.org.tw/" target="_blank" rel="noopener noreferrer">公視新聞網</a>
        </div>
      </section>
    </main>

    <footer>資料來源：中央氣象署、行政院人事行政總處。機率為模型推估，實際請以各縣市政府公告為準。</footer>
  </div>

  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/news.js"></script>
</body>
</html>
